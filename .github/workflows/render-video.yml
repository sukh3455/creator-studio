name: Creator Studio Cloud Video Renderer

# ==============================================================================
# CREATOR STUDIO — GITHUB ACTIONS CLOUD RENDERING PIPELINE
# Zero-cost ephemeral Ubuntu runner producing 1080x1920 MP4 video with FFmpeg
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique Render Job Identifier'
        required: true
        type: string
      project_id:
        description: 'Project Identifier'
        required: true
        type: string
      duration:
        description: 'Target Video Duration in Seconds'
        required: true
        default: '30'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '30'
          - '60'
      resolution:
        description: 'Target Video Resolution (WxH)'
        required: true
        default: '1080x1920'
        type: choice
        options:
          - '1080x1920'
          - '1920x1080'
          - '1080x1080'
          - '720x1280'
          - '1280x720'
      fps:
        description: 'Target Video Frame Rate'
        required: true
        default: '30'
        type: choice
        options:
          - '30'
          - '60'
      project_payload:
        description: 'Sanitized Approved Storyboard JSON'
        required: false
        type: string

# Concurrency Guard: Enforce strictly 1 active render job at a time to prevent quota exhaustion
concurrency:
  group: creator-studio-rendering
  cancel-in-progress: false

# Minimal permissions required for running workflow
permissions:
  contents: read
  actions: read

jobs:
  render-video:
    name: Render MP4 Video on Ubuntu Runner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 20
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install FFmpeg & System Fonts (Free Ubuntu Packages)
      - name: Install FFmpeg and Typography Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-freefont-ttf \
            fonts-dejavu \
            fonts-noto-color-emoji
          ffmpeg -version | head -n 1

      # Step 4: Install Node.js Dependencies
      - name: Install Dependencies
        run: |
          npm ci --omit=dev || npm install --omit=dev

      # Step 5: Input Validation & Security Shielding
      - name: Validate Inputs & Sanitize Payload
        id: sanitize
        run: |
          # Strict regex check on Job ID to prevent shell injection
          if [[ ! "${{ inputs.job_id }}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid job_id: strictly alphanumeric, underscores, and dashes permitted."
            exit 1
          fi

          # Save project payload to a temporary file rather than shell arguments
          mkdir -p .tmp_payloads
          PAYLOAD_FILE=".tmp_payloads/payload_${{ inputs.job_id }}.json"
          cat << 'EOF' > "$PAYLOAD_FILE"
          ${{ inputs.project_payload }}
          EOF
          echo "payload_path=$PAYLOAD_FILE" >> $GITHUB_OUTPUT

      # Step 6: Execute Headless Video Rendering & Durable Storage Upload
      - name: Render Video & Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          node worker/renderCli.js \
            --job-id "${{ inputs.job_id }}" \
            --project-id "${{ inputs.project_id }}" \
            --duration "${{ inputs.duration }}" \
            --resolution "${{ inputs.resolution }}" \
            --fps "${{ inputs.fps }}" \
            --payload-file "${{ steps.sanitize.outputs.payload_path }}" \
            --output "render_${{ inputs.job_id }}.mp4"

      # Step 7: Ephemeral File Cleanup
      - name: Cleanup Temporary Working Files
        if: always()
        run: |
          rm -rf .tmp_payloads
          rm -f temp_audio_*.aac
